services:
  deep-research:
    build:
      context: .
    working_dir: /workspace
    environment:
      TZ: Asia/Tokyo
      AGENT_BACKEND: ${AGENT_BACKEND:-agy}
      AGY_COMMAND: ${AGY_COMMAND:-agy}
      OPENCODE_COMMAND: ${OPENCODE_COMMAND:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-}
      OPENCODE_RUN_ARGS: ${OPENCODE_RUN_ARGS:-}
      OPENCODE_CONFIG: ${OPENCODE_CONFIG:-}
      OPENCODE_CONFIG_DIR: ${OPENCODE_CONFIG_DIR:-}
      SKIP_DISCORD_POST: ${SKIP_DISCORD_POST:-0}
      RUN_PHASE: ${RUN_PHASE:-all}
      RUN_DATE: ${RUN_DATE:-}
      PREVIOUS_DATE: ${PREVIOUS_DATE:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Mount the project root so generated agy-market-report files are visible on the host.
      - .:/workspace
      - ${AGY_BIN:?Set AGY_BIN to the host agy binary path, e.g. /home/you/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${AGY_HOME:-${HOME}/.gemini}:/home/app/.gemini
    command: ["./run.sh"]

  deep-research-scheduler:
    build:
      context: .
    working_dir: /workspace
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      AGENT_BACKEND: ${AGENT_BACKEND:-agy}
      AGY_COMMAND: ${AGY_COMMAND:-agy}
      OPENCODE_COMMAND: ${OPENCODE_COMMAND:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-}
      OPENCODE_RUN_ARGS: ${OPENCODE_RUN_ARGS:-}
      OPENCODE_CONFIG: ${OPENCODE_CONFIG:-}
      OPENCODE_CONFIG_DIR: ${OPENCODE_CONFIG_DIR:-}
      SKIP_DISCORD_POST: ${SKIP_DISCORD_POST:-0}
      RUN_PHASE: ${RUN_PHASE:-all}
      RUN_DATE: ${RUN_DATE:-}
      PREVIOUS_DATE: ${PREVIOUS_DATE:-}
      RUN_AT: ${RUN_AT:-07:30}
      RUN_ON_START: ${RUN_ON_START:-0}
      RUN_COMMAND: ${RUN_COMMAND:-./run.sh}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Mount the project root so generated agy-market-report files are visible on the host.
      - .:/workspace
      - ${AGY_BIN:?Set AGY_BIN to the host agy binary path, e.g. /home/you/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${AGY_HOME:-${HOME}/.gemini}:/home/app/.gemini
    command: ["python3", "scripts/scheduler.py"]
